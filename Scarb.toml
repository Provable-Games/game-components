[workspace]
members = [
    "packages/interfaces",
    "packages/embeddable_game_standard",
    "packages/metagame",
    "packages/economy",
    "packages/utilities",
    "packages/presets",
    "packages/testing",
    "packages/test_common",
]

[package]
name = "game_components"
readme = "README.md"
version.workspace = true
edition.workspace = true

[workspace.package]
version = "2.7.0"
edition = "2024_07"
cairo-version = "2.20.0"
authors = ["Provable Games <maintainers@provable.games>"]
keywords = [
    "starknet",
    "cairo",
    "onchain-games",
    "gaming",
    "game-components",
    "metagame",
    "minigame",
    "nft",
    "erc721"
]

[workspace.dependencies]
starknet = "2.20.0"
snforge_std = "=0.63.0"
openzeppelin_access = "=4.0.1"
openzeppelin_introspection = "=4.0.1"
openzeppelin_token = "=4.0.1"
openzeppelin_interfaces = "=2.2.0"
ekubo = { git = "https://github.com/EkuboProtocol/starknet-contracts.git", tag = "v4.0.1" }
metagame_extensions_interfaces = { git = "https://github.com/Provable-Games/metagame_extensions.git", tag = "v0.1.5" }
alexandria_merkle_tree = { git = "https://github.com/keep-starknet-strange/alexandria.git", tag = "v0.9.0" }

[dependencies]
starknet.workspace = true
# Group packages
game_components_interfaces = { path = "packages/interfaces" }
metagame_extensions_interfaces.workspace = true
game_components_embeddable_game_standard = { path = "packages/embeddable_game_standard" }
game_components_metagame = { path = "packages/metagame" }
game_components_economy = { path = "packages/economy" }
game_components_utilities = { path = "packages/utilities" }
game_components_presets = { path = "packages/presets" }
# Shared testing infrastructure
game_components_testing = { path = "packages/testing" }
game_components_test_common = { path = "packages/test_common" }

[dev-dependencies]
snforge_std.workspace = true

[lib]

[profile.dev.cairo]
unstable-add-statements-functions-debug-info = true
unstable-add-statements-code-locations-debug-info = true
inlining-strategy = "avoid"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[tool.snforge]
fuzzer_runs = 24

[[tool.snforge.fork]]
name = "MAINNET"
url = "https://api.cartridge.gg/x/starknet/mainnet/rpc/v0_9"
block_id.tag = "latest"
