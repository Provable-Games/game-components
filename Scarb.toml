[workspace]
members = [
    "packages/interfaces",
    "packages/metagame",
    "packages/minigame",
    "packages/registry",
    "packages/token",
    "packages/tokenomics",
    "packages/utils",
    "packages/leaderboard",
    "packages/registration",
    "packages/entry_requirement",
    "packages/presets",
    "packages/math",
    "packages/distribution",
    "packages/entry_fee",
    "packages/prize",
    # Shared testing infrastructure
    "packages/testing",
    "packages/test_common",
]

[package]
name = "game_components"
readme = "README.md"
version.workspace = true
edition.workspace = true

[workspace.package]
version = "1.5.1"
edition = "2024_07"
cairo-version = "2.15.1"
authors = ["Provable Games <maintainers@provable.games>"]
keywords = [
    "openzeppelin",
    "starknet",
    "contracts",
    "security",
    "standards"
]

[workspace.dependencies]
starknet = "2.15.1"
snforge_std = { git = "https://github.com/foundry-rs/starknet-foundry", tag = "v0.55.0" }
openzeppelin_access = { git = "https://github.com/OpenZeppelin/cairo-contracts.git", tag = "v3.0.0" }
openzeppelin_introspection = { git = "https://github.com/OpenZeppelin/cairo-contracts.git", tag = "v3.0.0" }
openzeppelin_token = { git = "https://github.com/OpenZeppelin/cairo-contracts.git", tag = "v3.0.0" }
openzeppelin_interfaces = { git = "https://github.com/OpenZeppelin/cairo-contracts.git", tag = "v3.0.0" }
ekubo = { git = "https://github.com/EkuboProtocol/starknet-contracts.git", tag = "v4.0.1" }

[dependencies]
starknet.workspace = true
# Core packages
game_components_interfaces = { path = "packages/interfaces" }
game_components_metagame = { path = "packages/metagame" }
game_components_minigame = { path = "packages/minigame" }
game_components_registry = { path = "packages/registry" }
game_components_token = { path = "packages/token" }
game_components_tokenomics = { path = "packages/tokenomics" }
game_components_utils = { path = "packages/utils" }
game_components_leaderboard = { path = "packages/leaderboard" }
game_components_registration = { path = "packages/registration" }
game_components_entry_requirement = { path = "packages/entry_requirement" }
game_components_presets = { path = "packages/presets" }
game_components_math = { path = "packages/math" }
game_components_distribution = { path = "packages/distribution" }
game_components_entry_fee = { path = "packages/entry_fee" }
game_components_prize = { path = "packages/prize" }
# Shared testing infrastructure
game_components_testing = { path = "packages/testing" }
game_components_test_common = { path = "packages/test_common" }

[dev-dependencies]
snforge_std.workspace = true

[lib]

[profile.dev.cairo]
unstable-add-statements-functions-debug-info = true
unstable-add-statements-code-locations-debug-info = true
inlining-strategy = "avoid"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[tool.snforge]
fuzzer_runs = 24

[[tool.snforge.fork]]
name = "MAINNET"
url = "https://api.cartridge.gg/x/starknet/mainnet/rpc/v0_9"
block_id.tag = "latest"
