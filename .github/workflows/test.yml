name: lint and test

on:
  push:
    branches:
      - main
    paths-ignore:
      - "ui/**"
      - "**/manifest.json"
      - ".github/**"
      - "pnpm-lock.yaml"
  pull_request:
    paths-ignore:
      - "ui/**"
      - "**/manifest.json"
      - "pnpm-lock.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_STEP_DEBUG: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout metrics
        run: |
          echo "::group::Git Statistics"
          echo "Objects in repo: $(git count-objects -v)"
          echo "Commit count: $(git rev-list --count HEAD)"
          echo "::endgroup::"

      - name: Extract scarb version
        run: echo "SCARB_VERSION=$(grep '^scarb ' .tool-versions | awk '{print $2}')" >> "$GITHUB_ENV"

      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: ${{ env.SCARB_VERSION }}

      - name: Cairo lint
        run: scarb fmt --check --workspace

  test:
    name: test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout metrics
        run: |
          echo "::group::Git Statistics"
          echo "Objects in repo: $(git count-objects -v)"
          echo "Commit count: $(git rev-list --count HEAD)"
          echo "::endgroup::"

      - name: Extract tool versions
        run: |
          echo "SCARB_VERSION=$(grep '^scarb ' .tool-versions | awk '{print $2}')" >> "$GITHUB_ENV"
          echo "FOUNDRY_VERSION=$(grep '^starknet-foundry ' .tool-versions | awk '{print $2}')" >> "$GITHUB_ENV"

      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: ${{ env.SCARB_VERSION }}

      - uses: foundry-rs/setup-snfoundry@v4
        with:
          starknet-foundry-version: ${{ env.FOUNDRY_VERSION }}

      # OPTIMIZATION: Split scarb deps cache (separate from target)
      - name: Cache Scarb dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/scarb
          key: ${{ runner.os }}-scarb-deps-${{ hashFiles('**/Scarb.lock') }}
          restore-keys: ${{ runner.os }}-scarb-deps-

      - name: Cache diagnostics - Scarb deps
        run: |
          echo "::group::Scarb Cache Status"
          echo "Cache path: ~/.cache/scarb"
          if [ -d ~/.cache/scarb ]; then
            echo "Size: $(du -sh ~/.cache/scarb | cut -f1)"
            echo "Files: $(find ~/.cache/scarb -type f | wc -l)"
          else
            echo "Cache directory not found (cold cache)"
          fi
          echo "::endgroup::"

      # OPTIMIZATION: Separate build artifacts cache with SHA for full invalidation
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-scarb-target-${{ hashFiles('**/Scarb.toml', '**/Scarb.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-scarb-target-${{ hashFiles('**/Scarb.toml', '**/Scarb.lock') }}-
            ${{ runner.os }}-scarb-target-

      - name: Cache diagnostics - Build artifacts
        run: |
          echo "::group::Target Cache Status"
          if [ -d target ]; then
            echo "Size: $(du -sh target | cut -f1)"
            echo "Files: $(find target -type f | wc -l)"
          else
            echo "Target directory not found (cold cache)"
          fi
          echo "::endgroup::"

      # OPTIMIZATION: Tool cache key based on .tool-versions hash
      - name: Cache tools
        uses: actions/cache@v4
        id: cache-tools
        with:
          path: |
            ~/.local/bin/cairo-coverage
            ~/.local/bin/universal-sierra-compiler
          key: ${{ runner.os }}-tools-${{ hashFiles('.tool-versions') }}
          restore-keys: ${{ runner.os }}-tools-

      - name: Install tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          (curl -L https://raw.githubusercontent.com/software-mansion/cairo-coverage/main/scripts/install.sh | sh) &
          (curl -L https://raw.githubusercontent.com/software-mansion/universal-sierra-compiler/master/scripts/install.sh | sh) &
          wait

      - name: Cache diagnostics - Tools
        run: |
          echo "::group::Tools Cache Status"
          echo "cairo-coverage: $(ls -la ~/.local/bin/cairo-coverage 2>/dev/null || echo 'not found')"
          echo "universal-sierra-compiler: $(ls -la ~/.local/bin/universal-sierra-compiler 2>/dev/null || echo 'not found')"
          echo "::endgroup::"

      - name: Run tests with fuzzing and coverage
        working-directory: packages/test_starknet
        run: snforge test --fuzzer-runs 500 --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: packages/test_starknet/coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Workflow timing summary
        if: always()
        run: |
          echo "::group::Timing Summary"
          echo "Workflow completed at: $(date -Iseconds)"
          echo "Runner: ${{ runner.os }}-${{ runner.arch }}"
          echo "Branch: OPTIMIZED (split caches, shallow clone, separate jobs)"
          echo "::endgroup::"
