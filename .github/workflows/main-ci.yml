name: Main CI

on:
  push:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
      infra_ci: ${{ steps.filter.outputs.infra_ci }}
      general_ci: ${{ steps.filter.outputs.general_ci }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            packages:
              - "packages/**"
              - "Scarb.toml"
              - "Scarb.lock"
              - ".tool-versions"
            infra_ci:
              - ".github/workflows/**"
              - ".github/prompts/**"
              - ".github/pull_request_template.md"
            general_ci:
              - "codecov.yml"
              - ".tool-versions"

  infra-validate:
    needs: changes
    if: needs.changes.outputs.infra_ci == 'true' || needs.changes.outputs.general_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Validate workflow YAML
        run: |
          YAML_CLI="yaml@2.8.1"
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$file" ] || continue
            npx -y "$YAML_CLI" valid < "$file"
          done

          if [ -f codecov.yml ]; then
            npx -y "$YAML_CLI" valid < codecov.yml
          fi

      - name: Validate package count matches codecov config
        run: |
          matrix_count=$(grep -cE '^\s+module:' .github/workflows/main-ci.yml)
          codecov_count=$(grep 'after_n_builds:' codecov.yml | grep -oE '[0-9]+')

          echo "Matrix entries: $matrix_count"
          echo "Codecov after_n_builds: $codecov_count"

          if [ "$matrix_count" != "$codecov_count" ]; then
            echo "::error::Matrix has $matrix_count entries but codecov.yml expects $codecov_count builds"
            echo "::error::Update codecov.yml after_n_builds to match matrix entry count"
            exit 1
          fi

          echo "Configuration validated: $matrix_count matrix entries"

  lint:
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup Scarb
        uses: software-mansion/setup-scarb@v1
        with:
          tool-versions: .tool-versions
          cache: false

      - name: Scarb fmt
        run: scarb fmt --check --workspace

  setup:
    needs: [changes, lint]
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Extract tool versions
        run: |
          echo "SCARB_VERSION=$(grep '^scarb ' .tool-versions | awk '{print $2}')" >> "$GITHUB_ENV"
          echo "FOUNDRY_VERSION=$(grep '^starknet-foundry ' .tool-versions | awk '{print $2}')" >> "$GITHUB_ENV"

      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: ${{ env.SCARB_VERSION }}
          cache: false

      - uses: foundry-rs/setup-snfoundry@v4
        with:
          starknet-foundry-version: ${{ env.FOUNDRY_VERSION }}

      - name: Cache Scarb dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/scarb
          key: ${{ runner.os }}-scarb-deps-${{ hashFiles('**/Scarb.toml', '**/Scarb.lock') }}
          restore-keys: |
            ${{ runner.os }}-scarb-deps-

      - name: Cache Cargo (snforge plugin + Scarb Rust deps)
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-snforge-${{ env.FOUNDRY_VERSION }}
          restore-keys: |
            ${{ runner.os }}-cargo-snforge-

      - name: Fetch dependencies
        run: scarb fetch

      - name: Warm snforge plugin cache
        run: snforge --version

  test:
    name: test (${{ matrix.module }}${{ matrix.total_partitions > 1 && format(' {0}/{1}', matrix.partition, matrix.total_partitions) || '' }})
    needs: setup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        # NOTE: When adding/removing modules, also update:
        #   - codecov.yml: after_n_builds must equal matrix entry count
        #   - AGENTS.md: CI Configuration section
        # Partitioned modules use snforge --partition INDEX/TOTAL to split
        # tests across multiple cheaper runners for parallelism.
        include:
          # Embeddable Game Standard — partitioned for parallelism
          # token: 4 partitions (~159 tests each)
          - package: game_components_embeddable_game_standard
            module: token
            runner: ubuntu-latest-8
            fuzzer_runs: 64
            partition: 1
            total_partitions: 4
          - package: game_components_embeddable_game_standard
            module: token
            runner: ubuntu-latest-8
            fuzzer_runs: 64
            partition: 2
            total_partitions: 4
          - package: game_components_embeddable_game_standard
            module: token
            runner: ubuntu-latest-8
            fuzzer_runs: 64
            partition: 3
            total_partitions: 4
          - package: game_components_embeddable_game_standard
            module: token
            runner: ubuntu-latest-8
            fuzzer_runs: 64
            partition: 4
            total_partitions: 4
          # minigame: 2 partitions (~107 tests each)
          - package: game_components_embeddable_game_standard
            module: minigame
            runner: ubuntu-latest-4
            fuzzer_runs: 64
            partition: 1
            total_partitions: 2
          - package: game_components_embeddable_game_standard
            module: minigame
            runner: ubuntu-latest-4
            fuzzer_runs: 64
            partition: 2
            total_partitions: 2
          # metagame: 2 partitions (~40 tests each)
          - package: game_components_embeddable_game_standard
            module: metagame
            runner: ubuntu-latest-4
            fuzzer_runs: 64
            partition: 1
            total_partitions: 2
          - package: game_components_embeddable_game_standard
            module: metagame
            runner: ubuntu-latest-4
            fuzzer_runs: 64
            partition: 2
            total_partitions: 2
          # registry: 2 partitions (~69 tests each)
          - package: game_components_embeddable_game_standard
            module: registry
            runner: ubuntu-latest-4
            fuzzer_runs: 64
            partition: 1
            total_partitions: 2
          - package: game_components_embeddable_game_standard
            module: registry
            runner: ubuntu-latest-4
            fuzzer_runs: 64
            partition: 2
            total_partitions: 2
          # Metagame — all partitioned (2 each)
          - package: game_components_metagame
            module: leaderboard
            runner: ubuntu-latest-4
            fuzzer_runs: 256
            partition: 1
            total_partitions: 2
          - package: game_components_metagame
            module: leaderboard
            runner: ubuntu-latest-4
            fuzzer_runs: 256
            partition: 2
            total_partitions: 2
          - package: game_components_metagame
            module: registration
            runner: ubuntu-latest-4
            fuzzer_runs: 256
            partition: 1
            total_partitions: 2
          - package: game_components_metagame
            module: registration
            runner: ubuntu-latest-4
            fuzzer_runs: 256
            partition: 2
            total_partitions: 2
          - package: game_components_metagame
            module: entry_requirement
            runner: ubuntu-latest-4
            fuzzer_runs: 256
            partition: 1
            total_partitions: 2
          - package: game_components_metagame
            module: entry_requirement
            runner: ubuntu-latest-4
            fuzzer_runs: 256
            partition: 2
            total_partitions: 2
          - package: game_components_metagame
            module: entry_fee
            runner: ubuntu-latest-4
            fuzzer_runs: 256
            partition: 1
            total_partitions: 2
          - package: game_components_metagame
            module: entry_fee
            runner: ubuntu-latest-4
            fuzzer_runs: 256
            partition: 2
            total_partitions: 2
          - package: game_components_metagame
            module: prize
            runner: ubuntu-latest-4
            fuzzer_runs: 256
            partition: 1
            total_partitions: 2
          - package: game_components_metagame
            module: prize
            runner: ubuntu-latest-4
            fuzzer_runs: 256
            partition: 2
            total_partitions: 2
          - package: game_components_metagame
            module: ticket_booth
            runner: ubuntu-latest-4
            fuzzer_runs: 256
            partition: 1
            total_partitions: 2
          - package: game_components_metagame
            module: ticket_booth
            runner: ubuntu-latest-4
            fuzzer_runs: 256
            partition: 2
            total_partitions: 2
          # Economy
          - package: game_components_economy
            module: tokenomics
            runner: ubuntu-latest-4
            fuzzer_runs: 256
            partition: 1
            total_partitions: 2
          - package: game_components_economy
            module: tokenomics
            runner: ubuntu-latest-4
            fuzzer_runs: 256
            partition: 2
            total_partitions: 2
          # Utilities — all partitioned except distribution
          - package: game_components_utilities
            module: math
            runner: ubuntu-latest-4
            fuzzer_runs: 256
            partition: 1
            total_partitions: 2
          - package: game_components_utilities
            module: math
            runner: ubuntu-latest-4
            fuzzer_runs: 256
            partition: 2
            total_partitions: 2
          - package: game_components_utilities
            module: distribution
            runner: ubuntu-latest-4
            fuzzer_runs: 256
            partition: 1
            total_partitions: 1
          - package: game_components_utilities
            module: utils
            runner: ubuntu-latest-4
            fuzzer_runs: 256
            partition: 1
            total_partitions: 2
          - package: game_components_utilities
            module: utils
            runner: ubuntu-latest-4
            fuzzer_runs: 256
            partition: 2
            total_partitions: 2
          - package: game_components_utilities
            module: renderer
            runner: ubuntu-latest-4
            fuzzer_runs: 256
            partition: 1
            total_partitions: 2
          - package: game_components_utilities
            module: renderer
            runner: ubuntu-latest-4
            fuzzer_runs: 256
            partition: 2
            total_partitions: 2
          # Presets (standalone package, no module filter)
          - package: game_components_presets
            module: presets
            runner: ubuntu-latest-4
            fuzzer_runs: 256
            partition: 1
            total_partitions: 2
          - package: game_components_presets
            module: presets
            runner: ubuntu-latest-4
            fuzzer_runs: 256
            partition: 2
            total_partitions: 2
    steps:
      - uses: actions/checkout@v6

      - name: Extract tool versions
        run: |
          echo "SCARB_VERSION=$(grep '^scarb ' .tool-versions | awk '{print $2}')" >> "$GITHUB_ENV"
          echo "FOUNDRY_VERSION=$(grep '^starknet-foundry ' .tool-versions | awk '{print $2}')" >> "$GITHUB_ENV"

      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: ${{ env.SCARB_VERSION }}
          cache: false

      - uses: foundry-rs/setup-snfoundry@v4
        with:
          starknet-foundry-version: ${{ env.FOUNDRY_VERSION }}

      - name: Cache Scarb dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/scarb
          key: ${{ runner.os }}-scarb-deps-${{ hashFiles('**/Scarb.toml', '**/Scarb.lock') }}
          restore-keys: |
            ${{ runner.os }}-scarb-deps-

      - name: Cache Cargo (snforge plugin)
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-snforge-${{ env.FOUNDRY_VERSION }}
          restore-keys: |
            ${{ runner.os }}-cargo-snforge-

      - name: Cache tools
        uses: actions/cache@v4
        id: cache-tools
        with:
          path: |
            ~/.local/bin/cairo-coverage
            ~/.local/bin/universal-sierra-compiler
          key: ${{ runner.os }}-tools-cairo-coverage-universal-sierra-compiler-v1

      - name: Install tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          (curl -L https://raw.githubusercontent.com/software-mansion/cairo-coverage/main/scripts/install.sh | sh) &
          (curl -L https://raw.githubusercontent.com/software-mansion/universal-sierra-compiler/master/scripts/install.sh | sh) &
          wait

      - name: Cache compiled packages
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-target-${{ matrix.package }}-${{ matrix.module }}-${{ env.SCARB_VERSION }}-${{ hashFiles('packages/**/*.cairo', '**/Scarb.toml', '**/Scarb.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-${{ matrix.package }}-${{ matrix.module }}-${{ env.SCARB_VERSION }}-

      - name: Run tests with coverage
        run: |
          PARTITION_FLAG=""
          if [ "${{ matrix.total_partitions }}" != "1" ]; then
            PARTITION_FLAG="--partition ${{ matrix.partition }}/${{ matrix.total_partitions }}"
          fi

          if [ "${{ matrix.package }}" = "game_components_${{ matrix.module }}" ]; then
            snforge test -p ${{ matrix.package }} --fuzzer-runs ${{ matrix.fuzzer_runs }} $PARTITION_FLAG --coverage 2>&1 | tee /tmp/test.log
          else
            snforge test -p ${{ matrix.package }} "::${{ matrix.module }}::" --fuzzer-runs ${{ matrix.fuzzer_runs }} $PARTITION_FLAG --coverage 2>&1 | tee /tmp/test.log
          fi

      - name: Check for compiler warnings
        if: always() && steps.cache-tools.outcome != 'failure'
        run: |
          if [ -f /tmp/test.log ] && grep -qE '^ --> .*\.cairo:[0-9]+:[0-9]+' /tmp/test.log; then
            echo "::error::Test compilation produced warnings. Fix all warnings before merging."
            grep -B1 -E '^ --> .*\.cairo:[0-9]+:[0-9]+' /tmp/test.log
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.lcov
          flags: ${{ matrix.module }}
          token: ${{ secrets.CODECOV_TOKEN }}

  main-ci:
    needs:
      - changes
      - infra-validate
      - lint
      - setup
      - test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          FAILED=$(echo "$NEEDS_JSON" | jq -r '
            to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled")
            | .key
          ')

          if [ -n "$FAILED" ]; then
            echo "::error::Failing jobs:"
            echo "$FAILED"
            exit 1
          fi

          echo "All required jobs passed or were skipped"
